name: Release Draft

# Keeps one draft GitHub Release up to date from the Conventional Commits on
# master since the latest v* tag. Publishing the draft creates the tag and
# triggers publish.yml. See docs/releasing.md.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    name: Update release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create/update the draft release
    env:
      GH_TOKEN: ${{ github.token }}
      GIT_CLIFF_VERSION: 2.9.1
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # git-cliff needs the full history and all tags

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Build notes and next version
      id: notes
      run: |
        if git describe --tags --exact-match --match 'v[0-9]*' HEAD >/dev/null 2>&1; then
          echo "HEAD is already tagged; nothing to draft."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        CLIFF="uvx --from git-cliff==${GIT_CLIFF_VERSION} git-cliff"
        VERSION="$($CLIFF --bumped-version)"
        $CLIFF --unreleased --tag "$VERSION" > notes.md
        printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
          "$GITHUB_REPOSITORY" \
          "$(git describe --tags --abbrev=0 --match 'v[0-9]*')" "$VERSION" >> notes.md
        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        cat notes.md

    - name: Create or update the draft release
      if: steps.notes.outputs.skip != 'true'
      env:
        VERSION: ${{ steps.notes.outputs.version }}
      run: |
        # Reuse the draft this workflow owns (drafts are not found by tag).
        ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
          --jq '[.[] | select(.draft and .author.login=="github-actions[bot]")][0].id // empty' | head -n1)"
        ARGS=(-f "tag_name=${VERSION}" -f "name=${VERSION}" \
              -f "target_commitish=${GITHUB_SHA}" -F "draft=true" -F "body=@notes.md")
        if [ -n "$ID" ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" "${ARGS[@]}" --jq .html_url
        else
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" "${ARGS[@]}" --jq .html_url
        fi
