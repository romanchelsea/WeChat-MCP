[project]
name = "wechat-mcp-xiongwe"
dynamic = ["version"]
description = "WeChat MCP server for reading and replying to messages via macOS Accessibility APIs"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Banghao Chi", email = "banghao2@illinois.edu" },
    { name = "Roman Wang" },
]
maintainers = [{ name = "Roman Wang" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
    "Environment :: MacOS X",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
keywords = [
    "wechat",
    "mcp",
    "macos",
    "accessibility",
    "automation",
    "chatbot",
]
dependencies = [
    "pyobjc>=12.1",
    "pyobjc-framework-applicationservices>=12.1",
    "pillow>=10.0.0",
    "mcp[cli]>=2.0.0,<3",
]

[project.urls]
Homepage = "https://github.com/romanchelsea/WeChat-MCP"
Repository = "https://github.com/romanchelsea/WeChat-MCP.git"
Issues = "https://github.com/romanchelsea/WeChat-MCP/issues"
Documentation = "https://github.com/romanchelsea/WeChat-MCP#readme"

[project.scripts]
wechat-mcp = "wechat_mcp.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version comes from the latest `vX.Y.Z` git tag; commits after a tag get
# the next patch plus `.devN`. See docs/releasing.md.
source = "vcs"

[tool.hatch.version.raw-options]
# PyPI and TestPyPI reject local versions (`+g<hash>`), so drop that suffix.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_mcp"]
